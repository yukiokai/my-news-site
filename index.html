        /* ── Header ─────────────────────────────── */

        .site-header .tagline {

            font-size: 0.8rem;
            color: var(--accent);
        }

        /* ── Stock Ticker ────────────────────────── */

            background: var(--surface-hover);

            overflow: hidden;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            flex-shrink: 0;

            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;

            transform: scale(1.06);

            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;

            opacity: 0.8;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));

            flex-direction: column;
            flex: 1;
            padding: 1rem 1.1rem;
            gap: 0.5rem;

            font-weight: 600;

            border-top: 1px solid var(--border);
            font-size: 0.75rem;
            flex-shrink: 0;
